[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "argus-sast"
version = "0.1.0"
description = "Open-source AI-agent SAST scanner for Java, Python and JavaScript, mapped to OWASP Top 10 and CWE."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Argus contributors" }]
keywords = ["sast", "security", "owasp", "cwe", "llm", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
  "Environment :: Console",
  "Framework :: FastAPI",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "tree-sitter>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
argus = "argus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
